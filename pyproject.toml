[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "akashik"
version = "0.10.2"
description = "Local-first structured memory library backed by SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "ollama>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
benchmark = ["sentence-transformers>=5.4", "rank-bm25>=0.2"]

[project.scripts]
akashik = "akashik.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["akashik*"]
